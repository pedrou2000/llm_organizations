<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}meta-work viz{% endblock %}</title>
<style>
  :root{
    --bg:#0f1115; --surface:#171a21; --surface2:#1e222c; --border:#2a2f3a;
    --ink:#e6e9ef; --ink2:#aab2c0; --muted:#6b7280;
    --accent:#4f8ff7;
    /* categorical (Okabe-Ito-derived), for action kinds */
    --k-prose:#8b93a3; --k-exec:#4f8ff7; --k-patch:#f2a541;
    --k-plan:#4fd1a5; --k-other:#c98bdb;
    --good:#3fb37f; --warn:#e0a641; --bad:#e5666b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  code,pre{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
  .wrap{max-width:1180px;margin:0 auto;padding:20px}
  header.top{border-bottom:1px solid var(--border);background:var(--surface);
    position:sticky;top:0;z-index:10}
  header.top .wrap{display:flex;align-items:center;gap:16px;padding:12px 20px}
  header.top .brand{font-weight:600;letter-spacing:.2px}
  header.top .brand a{color:var(--ink)}
  .muted{color:var(--muted)} .ink2{color:var(--ink2)}
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span class="brand"><a href="/">◆ meta-work trajectories</a></span>
  <span class="muted">{% block subtitle %}{% endblock %}</span>
</div></header>
<div class="wrap">
{% block body %}{% endblock %}
</div>
{% block script %}{% endblock %}
</body>
</html>
